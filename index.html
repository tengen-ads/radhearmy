<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
min-height:100%;
}

body{
min-height:100vh;
min-height:100svh;
display:flex;
align-items:center;
justify-content:center;
overflow-x:hidden;
padding:10px 10px 58px;
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(ellipse at 0% 15%,#ffd4df,transparent 45%),
radial-gradient(ellipse at 100% 90%,#ffe7b0,transparent 42%),
linear-gradient(135deg,#f9eeee,#e9fafa,#fff9e9);
}

/* MAIN COMPACT CARD */

.card{
position:relative;
z-index:1;
width:min(100%,410px);
height:min(650px,calc(100svh - 95px));
min-height:min(490px,calc(100svh - 105px));
padding:15px 15px;
border:1.5px solid #a4cfc3;
border-radius:38px;
background:rgba(255,255,255,.84);
box-shadow:0 20px 55px rgba(40,70,65,.13);
display:flex;
flex-direction:column;
align-items:center;
justify-content:space-evenly;
gap:5px;
overflow:hidden;
animation:cardEnter .9s ease both;
}

@keyframes cardEnter{
from{opacity:0;transform:translateY(25px) scale(.98)}
to{opacity:1;transform:translateY(0) scale(1)}
}

/* TOP LABEL */

.top-label{
display:flex;
align-items:center;
justify-content:center;
gap:9px;
padding:9px 15px;
border:1.5px solid #a4c9be;
border-radius:50px;
background:#fbeaf0;
color:#116454;
font-size:clamp(10px,3vw,13px);
font-weight:900;
font-style:italic;
letter-spacing:1.7px;
white-space:nowrap;
flex-shrink:0;
}

.dot{
width:11px;
height:11px;
border-radius:50%;
background:#f04469;
box-shadow:0 0 12px #f04469;
animation:dotPulse 1.5s infinite;
}

@keyframes dotPulse{
50%{box-shadow:0 0 20px 5px #f0446966}
}

/* DP ROTATING ANIMATION */

.dp-box{
position:relative;
width:clamp(110px,17vh,140px);
height:clamp(110px,17vh,140px);
flex-shrink:0;
margin:5px auto;
}

.dp-box img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
border:6px solid white;
position:relative;
z-index:2;
box-shadow:0 0 20px #f2789166;
}

.dp-box:before{
content:"";
position:absolute;
inset:-10px;
border-radius:50%;
border:5px solid #f27891;
border-left-color:#ffb3c4;
border-bottom-color:#ffc5d2;
animation:rotateRing 5s linear infinite;
}

.dp-box:after{
content:"";
position:absolute;
inset:-17px;
border-radius:50%;
background:rgba(245,100,140,.10);
filter:blur(12px);
animation:dpGlow 2s infinite alternate;
}

@keyframes rotateRing{
to{transform:rotate(360deg)}
}

@keyframes dpGlow{
from{opacity:.3;transform:scale(.96)}
to{opacity:1;transform:scale(1.08)}
}

/* ONE LINE ANIMATED HEADLINE */

.headline{
width:100%;
text-align:center;
white-space:nowrap;
font-size:clamp(22px,7.3vw,34px);
font-weight:1000;
font-style:italic;
letter-spacing:-1.2px;
line-height:1.2;
margin:4px 0;
flex-shrink:0;
}

.headline span{
display:inline-block;
background:linear-gradient(
110deg,
#f36c43 0%,
#ffad13 35%,
#f36c43 55%,
#142b27 75%,
#142b27 100%
);
background-size:250% auto;
-webkit-background-clip:text;
background-clip:text;
color:transparent;
animation:headlineShine 3s linear infinite;
}

@keyframes headlineShine{
0%{background-position:200% center}
100%{background-position:-200% center}
}

/* COMMUNITY BADGE */

.members{
padding:8px 19px;
border:1.5px solid #9acdbd;
border-radius:40px;
background:#e6f5f1;
color:#09634e;
font-size:14px;
font-weight:900;
white-space:nowrap;
flex-shrink:0;
}

/* TELEGRAM BUTTON */

.join-btn{
position:relative;
isolation:isolate;
overflow:hidden;
width:100%;
min-height:65px;
flex-shrink:0;
border:1px solid #ffb5a6;
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
padding:9px 6px;
text-decoration:none;
background:linear-gradient(105deg,#fa7891,#fa594f,#ffad08);
color:#111318;
font-size:clamp(15px,4.5vw,21px);
font-weight:1000;
box-shadow:0 10px 30px rgba(245,91,91,.27);
transition:transform .25s;
animation:buttonPulse 2s ease-in-out infinite;
}

.join-btn:active{
transform:scale(.96);
}

.join-btn:before{
content:"";
position:absolute;
z-index:-1;
top:-50%;
left:-100%;
width:55%;
height:200%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.65),
transparent
);
transform:rotate(25deg);
animation:buttonShine 3s infinite;
}

@keyframes buttonShine{
0%{left:-100%}
45%,100%{left:150%}
}

@keyframes buttonPulse{
0%,100%{box-shadow:0 8px 25px #fa6b7550}
50%{box-shadow:0 12px 38px #fa6b7590}
}

.telegram-icon{
font-size:27px;
}

/* THREE FEATURE BOXES */

.features{
width:100%;
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:8px;
flex-shrink:0;
}

.feature{
min-width:0;
height:83px;
border:1.5px solid #9bcbbd;
border-radius:17px;
background:rgba(225,246,241,.55);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:7px;
animation:featureIn .8s ease both;
}

.feature:nth-child(2){animation-delay:.2s}
.feature:nth-child(3){animation-delay:.4s}

@keyframes featureIn{
from{opacity:0;transform:translateY(12px)}
to{opacity:1;transform:translateY(0)}
}

.feature strong{
color:#ed6855;
font-size:clamp(11px,3.5vw,15px);
font-weight:1000;
white-space:nowrap;
}

.feature span{
color:#52776d;
font-size:10px;
font-weight:900;
letter-spacing:1px;
}

/* FOOTER */

.footer{
width:100%;
border-top:1.5px solid #a5cdbf;
padding-top:14px;
text-align:center;
color:#638078;
font-size:clamp(10px,3vw,13px);
line-height:1.5;
flex-shrink:0;
}

/* FLOATING PETALS */

.petal{
position:fixed;
z-index:0;
width:16px;
height:10px;
border-radius:100% 0 100% 0;
background:linear-gradient(135deg,#f5a0b0,#ffd3da);
box-shadow:0 3px 12px #f3648240;
pointer-events:none;
animation:petalFall linear infinite;
}

.p1{left:8%;animation-duration:9s}
.p2{left:27%;animation-duration:12s;animation-delay:-4s}
.p3{left:68%;animation-duration:10s;animation-delay:-3s}
.p4{left:90%;animation-duration:13s;animation-delay:-8s}
.p5{left:48%;animation-duration:11s;animation-delay:-5s}

@keyframes petalFall{
0%{top:-5%;transform:rotate(0deg) translateX(0)}
50%{transform:rotate(180deg) translateX(30px)}
100%{top:105%;transform:rotate(360deg) translateX(-20px)}
}

/* MADE BY RADHE */

.made-by{
position:fixed;
right:12px;
bottom:12px;
z-index:5;
display:flex;
align-items:center;
gap:8px;
padding:9px 14px;
border-radius:40px;
background:rgba(45,45,45,.80);
color:white;
font-size:13px;
font-weight:800;
box-shadow:0 5px 18px #0003;
backdrop-filter:blur(8px);
}

.made-icon{
width:25px;
height:25px;
border-radius:8px;
background:linear-gradient(135deg,#a77aff,#6742db);
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
}

/* SMALL MOBILE */

@media(max-width:350px){
.card{
padding:12px 10px;
border-radius:30px;
}

.headline{
font-size:21px;
letter-spacing:-1px;
}

.dp-box{
width:105px;
height:105px;
}

.join-btn{
min-height:58px;
font-size:14px;
gap:7px;
}

.feature{
height:75px;
}

.feature strong{
font-size:10px;
}

.feature span{
font-size:9px;
}

.top-label{
font-size:10px;
letter-spacing:1px;
}
}

/* SHORT HEIGHT PHONES */

@media(max-height:650px){
.card{
height:calc(100svh - 85px);
min-height:0;
padding:9px 12px;
gap:3px;
}

.dp-box{
width:90px;
height:90px;
}

.top-label{
padding:7px 12px;
}

.members{
padding:6px 15px;
}

.join-btn{
min-height:53px;
}

.features{
gap:6px;
}

.feature{
height:66px;
}

.footer{
padding-top:8px;
}
}

/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
animation-duration:.01ms!important;
animation-iteration-count:1!important;
}
}
</style>
</head>
